name: Temporary audited dependency repair

# One-off workflow confined to a review branch. Remove this workflow file
# before merging the dependency fix PR.
on:
  push:
    branches: [security/npm-audit-remediation-20261106]
    paths:
      - '.github/workflows/temp-npm-audit-repair.yml'

permissions:
  contents: write

jobs:
  repair:
    name: Fix safe dependency patches, verify, commit to review branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated review branch
        uses: actions/checkout@v4
        with:
          ref: security/npm-audit-remediation-20261106
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install current dependency tree
        run: npm install --legacy-peer-deps

      # Only allow non-breaking fixes as determined by npm. No --force.
      # A moderate finding may remain and cause npm audit fix to return 1;
      # the independent high/critical gate below must still pass.
      - name: Apply compatible npm security patches
        run: npm audit fix --legacy-peer-deps || true

      - name: Require zero high or critical advisories
        run: npm audit --audit-level=high

      - name: Type-check
        run: npm run lint

      - name: ESLint
        run: npx eslint . --config eslint.cleanup.config.js

      - name: Production build
        run: npm run build

      - name: Tests
        run: npm run test

      - name: Commit verified lockfile changes to this review branch only
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No compatible dependency updates were produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "security: apply compatible npm audit fixes after verification"
          git push origin HEAD:security/npm-audit-remediation-20261106
