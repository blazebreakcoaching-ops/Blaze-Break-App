<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="description" content="Blaze Break — burnout recovery for high performers. Fix the leak before you build the dream." />
    <link rel="canonical" href="https://www.blazebreak.app/" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Blaze Break — Burnout Recovery for High Performers</title>

    <!-- Open Graph / Twitter Card - what shows up when this link is
         pasted into iMessage, WhatsApp, SMS, Slack, or shared on social.
         Without these, a shared link previously showed as bare text with
         no image, title, or description - easy to mistake for a broken
         or suspicious link, especially on mobile messaging apps that
         hide the raw URL once a preview fails to load. og:image uses
         the full brand badge (not the small nav-bar flame icon) since
         link previews render large enough for its wordmark and tagline
         to actually be legible, unlike the tiny UI slots it was
         previously misused in. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.blazebreak.app/" />
    <meta property="og:site_name" content="Blaze Break" />
    <meta property="og:title" content="Blaze Break — Burnout Recovery for High Performers" />
    <meta property="og:description" content="Scale ambition without self-destruction. Blaze Break maps your personal burnout fingerprint and rebuilds real recovery into a hyper-scale workload - built for founders, executives, and high performers who can't just 'switch off.'" />
    <meta property="og:image" content="https://www.blazebreak.app/brand/flame-mark-dark.png" />
    <meta property="og:image:width" content="500" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:alt" content="Blaze Break — Rethink, Reflect, Rejuvenate" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Blaze Break — Burnout Recovery for High Performers" />
    <meta name="twitter:description" content="Scale ambition without self-destruction. Blaze Break maps your personal burnout fingerprint and rebuilds real recovery into a hyper-scale workload." />
    <meta name="twitter:image" content="https://www.blazebreak.app/brand/flame-mark-dark.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="/register-sw.js"></script>
  </body>
</html>
