name: Deploy

# Ships the app to the already-running Cloud Run service (see docs/DEPLOY.md)
# whenever main changes, or on demand via the "Run workflow" button - so
# "going live" never again means running gcloud/firebase commands by hand in
# Cloud Shell. Builds straight from source using Cloud Run's own buildpacks
# support (no Dockerfile needed - Node.js is auto-detected from
# package.json's "engines"/"scripts" fields), then deploys the current
# Firestore rules and indexes alongside it.
#
# Deliberately does NOT touch the Cloud Run service's env vars/secrets/IAM -
# those were configured once during the original manual setup (see
# docs/DEPLOY.md sections 1-3) and are left exactly as they are on every
# redeploy. This workflow only ever ships new code.
#
# Uses GitHub OpenID Connect and Google Workload Identity Federation to
# obtain temporary credentials; no long-lived service-account key is needed.
# Workflow-only edits do not auto-deploy; manually use auth_only=true to
# validate access without changing Cloud Run or Firestore.

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      auth_only:
        description: 'Verify Google Cloud identity only; do not deploy'
        type: boolean
        default: true

env:
  GCP_PROJECT_ID: gen-lang-client-0537893432
  CLOUD_RUN_SERVICE: blaze-break
  CLOUD_RUN_REGION: europe-west2

jobs:
  deploy:
    name: Deploy to Cloud Run + Firestore rules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud with OIDC
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          workload_identity_provider: projects/220686314556/locations/global/workloadIdentityPools/blaze-break-github/providers/blaze-break-github-actions
          service_account: github-actions-deploy@gen-lang-client-0537893432.iam.gserviceaccount.com
          create_credentials_file: true
          export_environment_variables: true

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Verify federated authentication (no deployment)
        run: |
          gcloud auth print-access-token > /dev/null
          echo 'Google Cloud federated authentication succeeded.'

      # --source builds the container via Cloud Build + Buildpacks on
      # Google's side - nothing to build or push locally in this job.
      - name: Deploy to Cloud Run
        if: ${{ github.event_name == 'push' || inputs.auth_only == false }}
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --region "$CLOUD_RUN_REGION" \
            --project "$GCP_PROJECT_ID" \
            --quiet

      - name: Set up Node.js (for the Firebase CLI)
        if: ${{ github.event_name == 'push' || inputs.auth_only == false }}
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # firebase-tools reads the temporary GOOGLE_APPLICATION_CREDENTIALS
      # exported by the auth action, not a long-lived JSON key.
      - name: Deploy Firestore rules + indexes
        if: ${{ github.event_name == 'push' || inputs.auth_only == false }}
        run: npx firebase-tools@latest deploy --only firestore:rules,firestore:indexes --project "$GCP_PROJECT_ID" --non-interactive
